name: check

# Only push to the default branch triggers a run; branches with an open PR run via the
# pull_request event, avoiding duplicate runs (and duplicate annotations) per commit.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  mix_check:
    name: mix check (Elixir ${{matrix.elixir}}, OTP ${{matrix.otp}})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Only this job emits GitHub annotations; others run check without --format
          # github so a finding isn't annotated once per matrix entry.
          - elixir: "1.20.4"
            otp: "29.1"
            os: "ubuntu-24.04"
            annotate: true
          - elixir: "1.20.4"
            otp: "28.5"
            os: "ubuntu-24.04"
            annotate: false
          # Elixir 1.17 floor (minimum supported version).
          - elixir: "1.17.3"
            otp: "26.2.2"
            os: "ubuntu-22.04"
            annotate: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-git-${{ github.sha }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Fetch deps
        run: mix deps.get

      - name: Remove application build
        run: mix clean

      - name: Compile deps
        run: mix deps.compile

      - name: Compile app
        run: mix compile

      - name: Run check
        run: mix check ${{ matrix.annotate && '--format github' || '' }}
